spring:
  application:
    name: task-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USER:taskmanager}
    password: ${DB_PASSWORD:taskmanager}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
